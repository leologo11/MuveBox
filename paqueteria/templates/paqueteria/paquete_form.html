{% extends "base.html" %}
{% block title %}{{ titulo }} · MuveBox{% endblock %}

{% block content %}
<div style="max-width:560px;margin:0 auto;">
    <div class="mb-card mb-card-soft">
        <h1 class="mb-heading" style="font-size:1.3rem;margin-bottom:20px;">{{ titulo }}</h1>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-field">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="mb-field-error">{{ field.errors|striptags }}</div>{% endif %}
            </div>
            {% endfor %}
            <div class="mb-flex mb-gap-sm" style="margin-top:8px;">
                <button type="submit" class="mb-btn mb-btn-primary">Guardar</button>
                <a href="{% url 'paqueteria:paquete_list' %}" class="mb-btn mb-btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% load paqueteria_extras %}
{% block title %}Eliminar paquete · MuveBox{% endblock %}

{% block content %}
<div style="max-width:480px;margin:0 auto;">
    <div class="mb-card mb-card-soft" style="border-top:3px solid var(--cancelled);">
        <h1 class="mb-heading" style="font-size:1.15rem;">{% icon 'trash' 18 %} ¿Eliminar el paquete {{ paquete.codigo_seguimiento }}?</h1>
        <p class="mb-muted">Esta acción no se puede deshacer.</p>
        <form method="post" class="mb-flex mb-gap-sm">
            {% csrf_token %}
            <button type="submit" class="mb-btn mb-btn-danger" style="background:var(--cancelled);color:#fff;">Sí, eliminar</button>
            <a href="{% url 'paqueteria:paquete_detail' paquete.pk %}" class="mb-btn mb-btn-ghost">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}

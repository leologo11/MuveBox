{% extends "base.html" %}
{% block title %}Iniciar sesión · MuveBox{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="card-title mb-3">Iniciar sesión</h4>
                {% if form.errors %}
                    <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
                        {{ form.password }}
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-dark w-100">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
